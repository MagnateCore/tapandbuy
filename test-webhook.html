<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Webhook - Tap & Buy</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); text-align: center; max-width: 400px; width: 100%; }
        button { background: #d4af37; color: #000; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; width: 100%; }
        button:hover { background: #e6c547; }
        #resultado { margin-top: 15px; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Prueba de Webhook</h2>
        <p>Haz clic para enviar un payload de prueba directo al motor de Activepieces.</p>
        <button onclick="enviarPrueba()">ENVIAR PRUEBA AHORA</button>
        <div id="resultado"></div>
    </div>

    <script>
        async function enviarPrueba() {
            const resDiv = document.getElementById('resultado');
            resDiv.innerHTML = "Enviando...";
            
            const WEBHOOK_URL = "https://cloud.activepieces.com/api/v1/webhooks/i4X82FVvLkL4YXlpMvu5H"; 

            const payload = {
                secret: "TB-_R8Q_NhIutCuDMG_6F_Pxw",
                tienda: "tap_and_buy",
                evento: "SOLICITUD_COTIZACION",
                pedido_id: "TEST-" + Math.floor(1000 + Math.random() * 9000),
                producto: "Camisa Minimalista Techwear",
                pais: "Venezuela",
                cliente: {
                    nombre: "Gustavo Prueba Incógnito",
                    contacto: "storetapbuy@gmail.com"
                },
                direccion: "Caracas"
            };

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    resDiv.innerHTML = "✅ ¡Enviado con éxito! HTTP " + response.status;
                } else {
                    resDiv.innerHTML = "⚠️ Error en la respuesta: HTTP " + response.status;
                }
            } catch (error) {
                resDiv.innerHTML = "❌ Error de red: " + error.message;
            }
        }
    </script>
</body>
</html>

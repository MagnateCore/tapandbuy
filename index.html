<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap & Buy - Global Express Fulfillment</title>
  <style>
    :root {
      --primary: #10B981;
      --primary-dark: #059669;
      --bg-color: #F8FAFC;
      --card-bg: #FFFFFF;
      --text-main: #1E293B;
      --text-muted: #64748B;
      --border-color: #E2E8F0;
      --accent-bg: #FEF3C7;
      --accent-text: #B45309;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      text-align: left;
    }
    .logo-container {
      text-align: center;
      margin-bottom: 4px;
    }
    .logo {
      font-size: 24px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }
    .logo span {
      color: var(--primary);
    }
    .store-info {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      text-align: center;
    }
    .notice-box {
      background: var(--accent-bg);
      color: var(--accent-text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 20px;
      line-height: 1.4;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border-color);
      background: #FFFFFF;
      border-radius: 8px;
      font-size: 14px;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
    }
    textarea {
      resize: vertical;
      height: 80px;
    }
    .btn-submit {
      display: block;
      width: 100%;
      padding: 14px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
      margin-top: 8px;
    }
    .btn-submit:hover {
      background-color: var(--primary-dark);
    }
    .security-note {
      margin-top: 16px;
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>

      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Your full name" required>

      <div class="form-group">

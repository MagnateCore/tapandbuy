<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba — ProPlaza Membresías</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f6;font-family:Inter,system-ui,sans-serif;padding:20px}
.box{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:32px;max-width:360px;width:100%;text-align:center}
h1{font-size:20px;color:#34495E;margin:0 0 8px}
p{font-size:14px;color:#64748b;margin:0 0 20px;line-height:1.5}
button{width:100%;height:52px;border:0;border-radius:14px;background:#34495E;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
button:active{background:#24374a}
#st{margin-top:14px;font-size:14px;font-weight:600;display:none}
</style>
<base target="_blank">
<base target="_blank">
</head>
<body>
<div class="box">
<h1>🧪 Prueba de Membresías</h1>
<p>Toca el botón para enviar un evento de prueba al flujo <strong>ProPlaza — Membresías</strong>. Debe llegar un mensaje al grupo de Telegram en menos de un minuto.</p>
<!-- REEMPLAZO ÚNICO: pegar aquí la URL del webhook del flujo "ProPlaza — Membresías" (termina en /webhooks/..., SIN /sync) -->
<button id="b" onclick="go()">Enviar prueba</button>
<p id="st"></p>
</div>
<script>
var W='https://cloud.activepieces.com/api/v1/webhooks/sFzWNREE8VRe9nn4nW9jP'; // ✅ flujo ProPlaza — Membresías (25 oct 2026)
async function go(){
  var st=document.getElementById('st');
  if(W.indexOf('PONER_')===0){st.textContent='⚠️ Falta pegar la URL del webhook en el código (línea var W=…)';st.style.color='#dc2626';st.style.display='block';return;}
  document.getElementById('b').textContent='Enviando…';
  try{
    var r=await fetch(W+'/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({evento:'TEST_MEMBRESIA'})});
    if(!r.ok) throw new Error('http '+r.status);
    st.textContent='✅ Enviada. Revisa tu grupo de Telegram.';
    st.style.color='#059669';
  }catch(e){
    st.textContent='❌ No se pudo enviar: '+e.message;
    st.style.color='#dc2626';
  }
  document.getElementById('b').textContent='Enviar prueba';
  st.style.display='block';
}
</script>
</body>
</html>
